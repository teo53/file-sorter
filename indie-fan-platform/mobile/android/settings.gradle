pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                properties.load(reader)
            }
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT")
        }
        if (flutterSdkPath == null) {
            def stdout = new ByteArrayOutputStream()
            exec {
                commandLine 'which', 'flutter'
                standardOutput = stdout
                ignoreExitValue = true
            }
            def flutterPath = stdout.toString().trim()
            if (flutterPath) {
                flutterSdkPath = new File(flutterPath).parentFile.parentFile.absolutePath
            }
        }
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties and FLUTTER_ROOT not found"
        return flutterSdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.0" apply false
}

include ":app"
