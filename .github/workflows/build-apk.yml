name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Get dependencies
        working-directory: indie-fan-platform/mobile
        run: flutter pub get --verbose

      - name: Analyze code
        working-directory: indie-fan-platform/mobile
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: indie-fan-platform/mobile
        run: flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pipo-apk
          path: indie-fan-platform/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
